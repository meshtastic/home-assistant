---
name: "Bug report"
description: "Report a bug with the integration"
labels: "Bug"
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
- type: input
  attributes:
    label: "Meshtastic Firmware Version"
    description: "Please provide the meshtastic firmware version of the gateway node you are using"
  validations:
    required: true
- type: textarea
  attributes:
    label: "Home Assistant System Health details"
    description: "Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have enabled debug logging for my installation.
        required: true
      - label: I have filled out the issue template to the best of my ability.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate issue of any [previous issues](https://github.com/meshtastic/home-assistant/issues?q=is%3Aissue+label%3A%22Bug%22+)..
        required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Home Assistant Debug logs"
    description: "To enable debug logs check this https://www.home-assistant.io/integrations/logger/, this **needs** to include _everything_ from startup of Home Assistant to the point where you encounter the issue."
    render: text
  validations:
    required: true

- type: textarea
  attributes:
    label: "Home Assistant Diagnostics dump"
    description: "Drag the diagnostics file here (Settings -> Devices & services -> Meshtastic -> three dots on the gateway entry -> Download diagnostics). Keys, credentials, hosts and positions are redacted, but check it before posting. See https://www.home-assistant.io/integrations/diagnostics/ for info."

- type: textarea
  attributes:
    label: "Meshtastic Node Debug logs"
    description: "If you have the possibility, please provide the serial output of your meshtastic node"
