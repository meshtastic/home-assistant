name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

        - name: "Set up uv"
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            python-version: "3.14"
            enable-cache: true

        - name: "Type check"
          run: uv run --group dev --group test mypy

        - name: "Test"
          run: uv run --group dev --group test python -m pytest tests
