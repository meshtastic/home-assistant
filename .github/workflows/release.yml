name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Set the manifest version from the release tag"
        shell: "bash"
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest="${{ github.workspace }}/custom_components/meshtastic/manifest.json"
          jq --arg version "${TAG#v}" '.version = $version' "$manifest" > "$manifest.new"
          mv "$manifest.new" "$manifest"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/meshtastic"
          zip homeassistant-meshtastic.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: "softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3" # v3.0.4
        with:
          files: ${{ github.workspace }}/custom_components/meshtastic/homeassistant-meshtastic.zip

  notify:
    name: "Announce on Discord"
    needs: "release"
    if: ${{ !github.event.release.prerelease }}
    runs-on: "ubuntu-latest"
    permissions: {}
    steps:
      - name: "Post the release to the #home-assistant webhook"
        shell: "bash"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_HOME_ASSISTANT }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "DISCORD_WEBHOOK_HOME_ASSISTANT is not set, skipping"
            exit 0
          fi
          # jq keeps quotes and newlines in the notes valid JSON; Discord caps an embed description at 4096
          payload=$(jq -n \
            --arg title "Home Assistant integration ${NAME:-$TAG}" \
            --arg description "${BODY:0:4096}" \
            --arg url "$URL" \
            '{content: null, embeds: [{title: $title, description: $description, url: $url, color: 6809855}]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
