name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

        - name: "Set up uv"
          uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
          with:
            python-version: "3.14"
            enable-cache: true

        - name: "Lint"
          run: uv run --only-group dev ruff check .

        - name: "Format"
          run: uv run --only-group dev ruff format . --check
